<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artigo - Edu Mais</title>
    <link rel="icon" type="image/png" href="assets/images/edu.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Merriweather:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        /* ===== ESTILOS (mesmos do blog) ===== */
        :root {
            --blog-bg: #f5f7fa;
            --blog-card: #ffffff;
            --blog-text: #1a1a2e;
            --blog-text-secondary: #4a4a6a;
            --blog-text-muted: #8a8aaa;
            --blog-border: #e8ecf1;
            --blog-shadow: 0 4px 20px rgba(0,0,0,0.06);
            --blog-shadow-hover: 0 8px 40px rgba(0,0,0,0.10);
            --blog-primary: #2563eb;
            --blog-radius: 16px;
            --blog-radius-sm: 8px;
            --blog-transition: all 0.3s ease;
        }

        [data-theme="dark"] {
            --blog-bg: #0f0f1a;
            --blog-card: #1a1a2e;
            --blog-text: #e8e8f0;
            --blog-text-secondary: #a8a8c0;
            --blog-text-muted: #6a6a8a;
            --blog-border: #2a2a44;
            --blog-shadow: 0 4px 20px rgba(0,0,0,0.3);
            --blog-shadow-hover: 0 8px 40px rgba(0,0,0,0.5);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--blog-bg);
            color: var(--blog-text);
            line-height: 1.6;
            transition: var(--blog-transition);
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
        .highlight { color: var(--blog-primary); font-weight: 700; }
        
        .blog-header {
            background: var(--blog-card);
            border-bottom: 1px solid var(--blog-border);
            padding: 16px 0;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(20px);
        }
        .blog-header .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .blog-header .nav-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }
        .blog-header .nav-brand .logo { height: 32px; width: auto; }
        .blog-header .nav-brand .brand-text { font-size: 18px; font-weight: 700; color: var(--blog-text); }
        .blog-header .nav-brand .brand-text .highlight { color: var(--blog-primary); }
        .blog-header .nav-links {
            display: flex;
            gap: 16px;
            align-items: center;
            flex-wrap: wrap;
        }
        .blog-header .nav-links a {
            color: var(--blog-text-secondary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: var(--blog-transition);
        }
        .blog-header .nav-links a:hover { color: var(--blog-primary); }
        .blog-header .nav-links a.active { color: var(--blog-primary); }
        
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 24px;
            border: none;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: var(--blog-transition);
            text-decoration: none;
        }
        .btn-primary { background: var(--blog-primary); color: #fff; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(37, 99, 235, 0.3); }
        .btn-outline { background: transparent; color: var(--blog-text); border: 2px solid var(--blog-border); }
        .btn-outline:hover { border-color: var(--blog-primary); color: var(--blog-primary); }
        .btn-outline-danger { background: transparent; color: #ff6b6b; border: 2px solid #ff6b6b; }
        .btn-outline-danger:hover { background: #ff6b6b; color: #fff; }
        .btn-danger { background: #e74c3c; color: #fff; }
        .btn-danger:hover { background: #c0392b; }
        .btn-sm { padding: 6px 16px; font-size: 13px; }

        .toast-container {
            position: fixed;
            top: 90px;
            right: 24px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 420px;
            width: 100%;
            pointer-events: none;
        }
        .toast-container .toast {
            pointer-events: all;
            padding: 16px 20px;
            border-radius: 8px;
            background: var(--blog-card);
            border: 1px solid var(--blog-border);
            box-shadow: var(--blog-shadow);
            display: flex;
            align-items: flex-start;
            gap: 14px;
            animation: slideInRight 0.4s ease forwards;
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }
        .toast-container .toast::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; }
        .toast-container .toast.success::before { background: #2E8B57; }
        .toast-container .toast.error::before { background: #e74c3c; }
        .toast-container .toast.warning::before { background: #f39c12; }
        .toast-container .toast.info::before { background: #3498db; }
        .toast-container .toast .toast-icon { font-size: 20px; flex-shrink: 0; margin-top: 2px; }
        .toast-container .toast.success .toast-icon { color: #2E8B57; }
        .toast-container .toast.error .toast-icon { color: #e74c3c; }
        .toast-container .toast.warning .toast-icon { color: #f39c12; }
        .toast-container .toast.info .toast-icon { color: #3498db; }
        .toast-container .toast .toast-content { flex: 1; display: flex; flex-direction: column; gap: 2px; }
        .toast-container .toast .toast-title { font-weight: 600; font-size: 14px; color: var(--blog-text); }
        .toast-container .toast .toast-message { font-size: 13px; color: var(--blog-text-secondary); line-height: 1.4; }
        .toast-container .toast .toast-close { background: none; border: none; color: var(--blog-text-muted); cursor: pointer; font-size: 16px; padding: 4px; transition: var(--blog-transition); flex-shrink: 0; }
        .toast-container .toast .toast-close:hover { color: var(--blog-text); transform: rotate(90deg); }
        .toast-container .toast.hiding { animation: slideOutRight 0.4s ease forwards; }
        @keyframes slideInRight { from { opacity: 0; transform: translateX(100px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes slideOutRight { from { opacity: 1; transform: translateX(0); } to { opacity: 0; transform: translateX(100px); } }

        /* ===== POST ARTICLE ===== */
        .post-article {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 24px 60px;
            background: var(--blog-bg);
            min-height: 60vh;
        }
        .post-article .article-header { margin-bottom: 32px; }
        .post-article .article-header .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--blog-primary);
            text-decoration: none;
            font-weight: 500;
            margin-bottom: 16px;
            font-size: 14px;
        }
        .post-article .article-header .back-link:hover { text-decoration: underline; }
        .post-article .article-header h1 {
            font-size: 38px;
            font-weight: 800;
            color: var(--blog-text);
            line-height: 1.2;
            margin-bottom: 12px;
            font-family: 'Merriweather', serif;
        }
        .post-article .article-header .article-meta {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            color: var(--blog-text-muted);
            font-size: 14px;
        }
        .post-article .article-header .article-meta span {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .post-article .article-featured-image {
            width: 100%;
            max-height: 400px;
            object-fit: cover;
            border-radius: var(--blog-radius);
            margin-bottom: 32px;
            background: var(--blog-border);
        }
        .post-article .article-content {
            font-size: 17px;
            line-height: 1.8;
            color: var(--blog-text-secondary);
            font-family: 'Merriweather', serif;
        }
        .post-article .article-content h2 {
            font-size: 26px;
            color: var(--blog-text);
            margin: 32px 0 12px;
            font-weight: 700;
        }
        .post-article .article-content h3 {
            font-size: 20px;
            color: var(--blog-text);
            margin: 24px 0 8px;
            font-weight: 600;
        }
        .post-article .article-content p { margin-bottom: 16px; }
        .post-article .article-content img {
            max-width: 100%;
            border-radius: var(--blog-radius-sm);
            margin: 16px 0;
        }
        .post-article .article-content ul,
        .post-article .article-content ol {
            margin: 12px 0 16px 24px;
        }
        .post-article .article-content li { margin-bottom: 6px; }
        .post-article .article-content blockquote {
            border-left: 4px solid var(--blog-primary);
            padding: 12px 20px;
            margin: 16px 0;
            background: var(--blog-card);
            border-radius: 0 var(--blog-radius-sm) var(--blog-radius-sm) 0;
            font-style: italic;
            color: var(--blog-text-secondary);
        }
        .post-article .article-content code {
            background: var(--blog-card);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 14px;
            border: 1px solid var(--blog-border);
        }
        .post-article .article-content pre {
            background: var(--blog-card);
            padding: 16px;
            border-radius: var(--blog-radius-sm);
            overflow-x: auto;
            border: 1px solid var(--blog-border);
            font-size: 14px;
        }

        .blog-empty {
            text-align: center;
            padding: 80px 20px;
            color: var(--blog-text-muted);
        }
        .blog-empty i { font-size: 64px; opacity: 0.3; margin-bottom: 16px; }
        .blog-empty h3 { font-size: 24px; color: var(--blog-text); margin-bottom: 8px; }

        .blog-loading {
            text-align: center;
            padding: 60px 20px;
        }
        .blog-loading i {
            font-size: 40px;
            color: var(--blog-primary);
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .admin-actions {
            display: flex;
            gap: 8px;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid var(--blog-border);
        }

        .hamburger {
            display: none;
            flex-direction: column;
            gap: 5px;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 4px;
        }
        .hamburger span {
            display: block;
            width: 25px;
            height: 2px;
            background: var(--blog-text);
            transition: var(--blog-transition);
            border-radius: 2px;
        }
        .hamburger.active span:nth-child(1) { transform: rotate(45deg) translate(5px, 5px); }
        .hamburger.active span:nth-child(2) { opacity: 0; }
        .hamburger.active span:nth-child(3) { transform: rotate(-45deg) translate(5px, -5px); }

        @media (max-width: 768px) {
            .blog-header .nav-links { display: none; }
            .blog-header .nav-links.open {
                display: flex;
                flex-direction: column;
                position: absolute;
                top: 70px;
                left: 0;
                right: 0;
                background: var(--blog-card);
                padding: 16px 24px;
                border-bottom: 1px solid var(--blog-border);
            }
            .hamburger { display: flex; }
            .post-article .article-header h1 { font-size: 28px; }
            .post-article .article-content { font-size: 15px; }
        }
        @media (max-width: 480px) {
            .post-article .article-header h1 { font-size: 22px; }
        }
    </style>
</head>
<body>

<!-- ===== TOAST ===== -->
<div class="toast-container" id="toastContainer"></div>

<!-- ===== HEADER ===== -->
<header class="blog-header">
    <div class="container">
        <a href="/Edu-Mais/" class="nav-brand">
            <img src="assets/images/edu.png" alt="Edu Mais" class="logo" onerror="this.style.display='none'">
            <span class="brand-text">Edu <span class="highlight">Mais</span></span>
        </a>
        <div class="nav-links" id="navLinks">
            <a href="/Edu-Mais/">Início</a>
            <a href="/Edu-Mais/blog.html">Blog</a>
            <a href="/Edu-Mais/materiais.html">Materiais</a>
            <a href="/Edu-Mais/#contato">Contato</a>
            <button class="btn btn-primary btn-sm" id="authBtnPost">Entrar</button>
            <button class="btn btn-outline-danger btn-sm" id="logoutBtnPost" style="display:none;">Sair</button>
        </div>
        <button class="hamburger" id="hamburger">
            <span></span><span></span><span></span>
        </button>
    </div>
</header>

<!-- ===== POST CONTENT ===== -->
<div id="postContent">
    <div class="blog-loading" style="padding:60px 20px;text-align:center;">
        <i class="fas fa-spinner fa-spin" style="font-size:40px;color:var(--blog-primary);"></i>
        <p style="color:var(--blog-text-muted);margin-top:12px;">Carregando artigo...</p>
    </div>
</div>

<!-- ===== SCRIPTS ===== -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.38.4/dist/umd/supabase.min.js"></script>
<script>
// ============================================
// CONFIGURAÇÃO SUPABASE
// ============================================
const SUPABASE_URL = 'https://gslhfgaoqkcrhyfnmmxt.supabase.co'
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdzbGhmZ2FvcWtjcmh5Zm5tbXh0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3MDY1OTEsImV4cCI6MjEwMjI4MjU5MX0.tuUvoVuFni1eh0M_j-iG_qI-vwa3116a7mgyCqhVejk'

const supabaseBlog = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

// ============================================
// TOAST
// ============================================
const ToastBlog = {
    container: document.getElementById('toastContainer'),
    show: function(title, message, type, duration) {
        const icons = { success: 'fa-check-circle', error: 'fa-exclamation-circle', warning: 'fa-exclamation-triangle', info: 'fa-info-circle' }
        const toast = document.createElement('div')
        toast.className = 'toast ' + (type || 'info')
        toast.innerHTML = `
            <i class="fas ${icons[type] || icons.info} toast-icon"></i>
            <div class="toast-content">
                <div class="toast-title">${title}</div>
                <div class="toast-message">${message}</div>
            </div>
            <button class="toast-close"><i class="fas fa-times"></i></button>
        `
        toast.querySelector('.toast-close').onclick = function() {
            toast.classList.add('hiding')
            setTimeout(function() { if (toast.parentNode) toast.parentNode.removeChild(toast) }, 400)
        }
        setTimeout(function() {
            toast.classList.add('hiding')
            setTimeout(function() { if (toast.parentNode) toast.parentNode.removeChild(toast) }, 400)
        }, duration || 4000)
        ToastBlog.container.appendChild(toast)
        return toast
    },
    success: function(title, msg, d) { return this.show(title, msg, 'success', d || 4000) },
    error: function(title, msg, d) { return this.show(title, msg, 'error', d || 5000) },
    warning: function(title, msg, d) { return this.show(title, msg, 'warning', d || 4000) },
    info: function(title, msg, d) { return this.show(title, msg, 'info', d || 3000) }
}

// ============================================
// ESTADO
// ============================================
let currentUserBlog = null
let isAdminBlog = false

// ============================================
// VERIFICAR SESSÃO
// ============================================
async function checkBlogSession() {
    try {
        const { data: { session } } = await supabaseBlog.auth.getSession()
        if (session) {
            currentUserBlog = session.user
            const { data } = await supabaseBlog.from('admins').select('id').eq('id', currentUserBlog.id).maybeSingle()
            isAdminBlog = !!data
        } else {
            currentUserBlog = null
            isAdminBlog = false
        }
        updateBlogButtons()
    } catch (error) {
        console.error('Erro ao verificar sessão:', error)
    }
}

function updateBlogButtons() {
    const authBtn = document.getElementById('authBtnPost')
    const logoutBtn = document.getElementById('logoutBtnPost')
    if (currentUserBlog) {
        if (authBtn) authBtn.style.display = 'none'
        if (logoutBtn) logoutBtn.style.display = 'inline-flex'
    } else {
        if (authBtn) authBtn.style.display = 'inline-flex'
        if (logoutBtn) logoutBtn.style.display = 'none'
    }
}

// ============================================
// FORMATAR DATA
// ============================================
function formatDateBlog(dateString) {
    if (!dateString) return 'Data não disponível'
    try {
        const d = new Date(dateString)
        return d.toLocaleDateString('pt-PT', { day: '2-digit', month: 'long', year: 'numeric' })
    } catch {
        return 'Data inválida'
    }
}

// ============================================
// CARREGAR POST
// ============================================
async function loadPost() {
    const container = document.getElementById('postContent')
    if (!container) return
    
    const params = new URLSearchParams(window.location.search)
    const slug = params.get('slug')
    
    if (!slug) {
        container.innerHTML = `
            <div class="blog-empty">
                <i class="fas fa-exclamation-circle"></i>
                <h3>Publicação não encontrada</h3>
                <p>O artigo que você procura não existe.</p>
                <a href="/Edu-Mais/blog.html" class="btn btn-primary btn-sm" style="margin-top:12px;">
                    <i class="fas fa-arrow-left"></i> Voltar ao blog
                </a>
            </div>
        `
        return
    }
    
    container.innerHTML = '<div class="blog-loading"><i class="fas fa-spinner fa-spin"></i><p style="color:var(--blog-text-muted);margin-top:12px;">Carregando artigo...</p></div>'
    
    try {
        console.log('📝 Carregando post:', slug)
        const { data: post, error } = await supabaseBlog.from('posts').select('*').eq('slug', slug).single()
        
        if (error) {
            console.error('❌ Erro ao buscar post:', error)
            throw error
        }
        
        if (!post) {
            throw new Error('Post não encontrado')
        }
        
        if (!post.is_published && !isAdminBlog) {
            container.innerHTML = `
                <div class="blog-empty">
                    <i class="fas fa-lock"></i>
                    <h3>Publicação não disponível</h3>
                    <p>Este artigo não está publicado.</p>
                    <a href="/Edu-Mais/blog.html" class="btn btn-primary btn-sm" style="margin-top:12px;">
                        <i class="fas fa-arrow-left"></i> Voltar ao blog
                    </a>
                </div>
            `
            return
        }
        
        // Incrementar visualizações
        try {
            const newViews = (post.views || 0) + 1
            await supabaseBlog
                .from('posts')
                .update({ views: newViews })
                .eq('id', post.id)
            post.views = newViews
            console.log('✅ Views atualizadas:', newViews)
        } catch (viewError) {
            console.warn('⚠️ Erro ao atualizar views:', viewError)
        }
        
        renderPost(post)
        
    } catch (error) {
        console.error('❌ Erro ao carregar post:', error)
        container.innerHTML = `
            <div class="blog-empty">
                <i class="fas fa-exclamation-triangle"></i>
                <h3>Erro ao carregar</h3>
                <p>Não foi possível carregar este artigo.</p>
                <a href="/Edu-Mais/blog.html" class="btn btn-primary btn-sm" style="margin-top:12px;">
                    <i class="fas fa-arrow-left"></i> Voltar ao blog
                </a>
            </div>
        `
    }
}

// ============================================
// RENDERIZAR POST
// ============================================
function renderPost(post) {
    const container = document.getElementById('postContent')
    if (!container) return
    
    const imageHtml = post.featured_image ? 
        '<img src="' + post.featured_image + '" alt="' + post.title + '" class="article-featured-image">' : 
        ''
    
    const adminHtml = isAdminBlog ? `
        <div class="admin-actions">
            <a href="/Edu-Mais/blog-admin.html?edit=${post.id}" class="btn btn-primary btn-sm">
                <i class="fas fa-edit"></i> Editar
            </a>
            <button class="btn btn-danger btn-sm" onclick="deletePost(${post.id})">
                <i class="fas fa-trash"></i> Excluir
            </button>
        </div>
    ` : ''
    
    container.innerHTML = `
        <article class="post-article">
            <div class="article-header">
                <a href="/Edu-Mais/blog.html" class="back-link">
                    <i class="fas fa-arrow-left"></i> Voltar para o blog
                </a>
                <h1>${post.title}</h1>
                <div class="article-meta">
                    <span><i class="far fa-calendar-alt"></i> ${formatDateBlog(post.published_at)}</span>
                    <span><i class="far fa-user"></i> ${post.author_name || 'Admin'}</span>
                    <span><i class="far fa-folder"></i> ${post.category || 'Geral'}</span>
                    <span><i class="far fa-eye"></i> ${post.views || 0} visualizações</span>
                    ${!post.is_published && isAdminBlog ? '<span style="color:#f39c12;">📝 Rascunho</span>' : ''}
                </div>
            </div>
            ${imageHtml}
            <div class="article-content">${post.content}</div>
            ${adminHtml}
        </article>
    `
}

// ============================================
// ADMIN - EXCLUIR POST
// ============================================
async function deletePost(postId) {
    if (!confirm('Tem certeza que deseja excluir esta publicação?')) return
    try {
        await supabaseBlog.from('posts').delete().eq('id', postId)
        ToastBlog.success('Publicação excluída!', 'O artigo foi removido.')
        window.location.href = '/Edu-Mais/blog.html'
    } catch (error) {
        ToastBlog.error('Erro', 'Não foi possível excluir.')
    }
}

// ============================================
// EVENTOS
// ============================================
document.addEventListener('DOMContentLoaded', function() {
    console.log('📝 Inicializando post...')
    
    // Botão Entrar
    const authBtn = document.getElementById('authBtnPost')
    if (authBtn) {
        authBtn.addEventListener('click', function(e) {
            e.preventDefault()
            window.location.href = '/Edu-Mais/#authModal'
        })
    }
    
    // Botão Sair
    const logoutBtn = document.getElementById('logoutBtnPost')
    if (logoutBtn) {
        logoutBtn.addEventListener('click', async function() {
            await supabaseBlog.auth.signOut()
            window.location.href = '/Edu-Mais/'
        })
    }
    
    // Menu mobile
    const hamburger = document.getElementById('hamburger')
    const navLinks = document.getElementById('navLinks')
    if (hamburger && navLinks) {
        hamburger.addEventListener('click', function() {
            this.classList.toggle('active')
            navLinks.classList.toggle('open')
        })
    }
    
    checkBlogSession().then(function() {
        loadPost()
    })
})
