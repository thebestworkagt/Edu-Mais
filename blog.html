<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog - Edu Mais</title>
 <!-- ===== FAVICON ===== -->
    <link rel="icon" type="image/png" href="assets/images/edu.png">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- ... -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Merriweather:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        /* ===== ESTILOS DO BLOG (EMBUTIDOS) ===== */
        :root {
            --blog-bg: #f5f7fa;
            --blog-card: #ffffff;
            --blog-text: #1a1a2e;
            --blog-text-secondary: #4a4a6a;
            --blog-text-muted: #8a8aaa;
            --blog-border: #e8ecf1;
            --blog-shadow: 0 4px 20px rgba(0,0,0,0.06);
            --blog-shadow-hover: 0 8px 40px rgba(0,0,0,0.10);
            --blog-primary: #2563eb;
            --blog-radius: 16px;
            --blog-radius-sm: 8px;
            --blog-transition: all 0.3s ease;
        }
        [data-theme="dark"] {
            --blog-bg: #0f0f1a;
            --blog-card: #1a1a2e;
            --blog-text: #e8e8f0;
            --blog-text-secondary: #a8a8c0;
            --blog-text-muted: #6a6a8a;
            --blog-border: #2a2a44;
            --blog-shadow: 0 4px 20px rgba(0,0,0,0.3);
            --blog-shadow-hover: 0 8px 40px rgba(0,0,0,0.5);
        }
        .blog-header { background: var(--blog-card); border-bottom: 1px solid var(--blog-border); padding: 16px 0; position: sticky; top: 0; z-index: 100; backdrop-filter: blur(20px); }
        .blog-header .container { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; max-width: 1200px; margin: 0 auto; padding: 0 24px; }
        .blog-header .nav-brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }
        .blog-header .nav-brand .logo { height: 32px; }
        .blog-header .nav-brand .brand-text { font-size: 18px; font-weight: 700; color: var(--blog-text); }
        .blog-header .nav-brand .brand-text .highlight { color: var(--blog-primary); }
        .blog-header .nav-links { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
        .blog-header .nav-links a { color: var(--blog-text-secondary); text-decoration: none; font-size: 14px; font-weight: 500; transition: var(--blog-transition); }
        .blog-header .nav-links a:hover { color: var(--blog-primary); }
        .blog-header .nav-links a.active { color: var(--blog-primary); }
        .blog-hero { background: var(--blog-primary); padding: 60px 0 48px; color: #fff; text-align: center; }
        .blog-hero h1 { font-size: 42px; font-weight: 800; margin-bottom: 8px; letter-spacing: -0.5px; }
        .blog-hero p { font-size: 18px; opacity: 0.85; max-width: 600px; margin: 0 auto; }
        .blog-feed { padding: 0 0 60px; background: var(--blog-bg); min-height: 60vh; }
        .blog-feed .container { max-width: 900px; margin: 0 auto; padding: 0 24px; }
        .blog-toolbar { display: flex; gap: 16px; margin-bottom: 32px; flex-wrap: wrap; }
        .blog-toolbar .search-box { flex: 1; min-width: 200px; display: flex; align-items: center; background: var(--blog-card); border: 1px solid var(--blog-border); border-radius: var(--blog-radius-sm); padding: 0 16px; transition: var(--blog-transition); }
        .blog-toolbar .search-box:focus-within { border-color: var(--blog-primary); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15); }
        .blog-toolbar .search-box i { color: var(--blog-text-muted); font-size: 16px; }
        .blog-toolbar .search-box input { border: none; background: transparent; padding: 12px 12px; font-size: 14px; color: var(--blog-text); width: 100%; outline: none; font-family: 'Inter', sans-serif; }
        .blog-toolbar .search-box input::placeholder { color: var(--blog-text-muted); }
        .blog-toolbar .filter-category { padding: 10px 16px; border: 1px solid var(--blog-border); border-radius: var(--blog-radius-sm); background: var(--blog-card); color: var(--blog-text); font-size: 14px; cursor: pointer; font-family: 'Inter', sans-serif; min-width: 140px; }
        .blog-toolbar .filter-category:focus { outline: none; border-color: var(--blog-primary); }
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 24px; border: none; border-radius: 8px; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 14px; cursor: pointer; transition: all 0.3s ease; text-decoration: none; }
        .btn-primary { background: linear-gradient(135deg, #217346 0%, #2E8B57 50%, #3BA370 100%); color: #fff; box-shadow: 0 4px 20px rgba(33,115,70,0.3); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(33,115,70,0.5); }
        .btn-outline { background: transparent; color: var(--text-primary); border: 2px solid var(--border-color); }
        .btn-outline:hover { border-color: var(--primary); color: var(--primary-light); }
        .btn-outline-danger { background: transparent; color: #ff6b6b; border: 2px solid #ff6b6b; }
        .btn-outline-danger:hover { background: #ff6b6b; color: #fff; }
        .btn-sm { padding: 6px 16px; font-size: 13px; }
        .posts-grid { display: grid; gap: 24px; }
        .post-card { background: var(--blog-card); border-radius: var(--blog-radius); overflow: hidden; border: 1px solid var(--blog-border); transition: var(--blog-transition); cursor: pointer; display: flex; gap: 0; }
        .post-card:hover { transform: translateY(-4px); box-shadow: var(--blog-shadow-hover); border-color: var(--blog-primary); }
        .post-card .post-image { width: 280px; min-height: 200px; flex-shrink: 0; background: var(--blog-border); display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .post-card .post-image img { width: 100%; height: 100%; object-fit: cover; }
        .post-card .post-image .no-image { font-size: 48px; color: var(--blog-text-muted); opacity: 0.3; }
        .post-card .post-content { padding: 24px 28px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .post-card .post-meta { display: flex; gap: 16px; align-items: center; font-size: 13px; color: var(--blog-text-muted); margin-bottom: 8px; flex-wrap: wrap; }
        .post-card .post-meta .category { background: rgba(37, 99, 235, 0.12); color: var(--blog-primary); padding: 2px 12px; border-radius: 50px; font-weight: 600; font-size: 12px; }
        .post-card .post-meta .date { display: flex; align-items: center; gap: 4px; }
        .post-card .post-title { font-size: 20px; font-weight: 700; color: var(--blog-text); margin-bottom: 8px; line-height: 1.3; }
        .post-card .post-title a { color: inherit; text-decoration: none; }
        .post-card .post-title a:hover { color: var(--blog-primary); }
        .post-card .post-excerpt { color: var(--blog-text-secondary); font-size: 15px; line-height: 1.6; margin-bottom: 12px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        .post-card .post-footer { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--blog-text-muted); padding-top: 12px; border-top: 1px solid var(--blog-border); }
        .post-card .post-footer .author { display: flex; align-items: center; gap: 8px; }
        .post-card .post-footer .author .avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--blog-primary); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; }
        .blog-loading { text-align: center; padding: 60px 20px; }
        .blog-loading i { font-size: 40px; color: var(--blog-primary); animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .blog-empty { text-align: center; padding: 80px 20px; color: var(--blog-text-muted); }
        .blog-empty i { font-size: 64px; opacity: 0.3; margin-bottom: 16px; }
        .blog-empty h3 { font-size: 24px; color: var(--blog-text); margin-bottom: 8px; }
        .toast-container { position: fixed; top: 90px; right: 24px; z-index: 9999; display: flex; flex-direction: column; gap: 12px; max-width: 420px; width: 100%; pointer-events: none; }
        .toast-container .toast { pointer-events: all; padding: 16px 20px; border-radius: 8px; background: var(--bg-card); border: 1px solid var(--border-color); box-shadow: var(--shadow); display: flex; align-items: flex-start; gap: 14px; animation: slideInRight 0.4s ease forwards; backdrop-filter: blur(10px); position: relative; overflow: hidden; }
        .toast-container .toast::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; }
        .toast-container .toast.success::before { background: #2E8B57; }
        .toast-container .toast.error::before { background: #e74c3c; }
        .toast-container .toast.warning::before { background: #f39c12; }
        .toast-container .toast.info::before { background: #3498db; }
        .toast-container .toast .toast-icon { font-size: 20px; flex-shrink: 0; margin-top: 2px; }
        .toast-container .toast.success .toast-icon { color: #2E8B57; }
        .toast-container .toast.error .toast-icon { color: #e74c3c; }
        .toast-container .toast.warning .toast-icon { color: #f39c12; }
        .toast-container .toast.info .toast-icon { color: #3498db; }
        .toast-container .toast .toast-content { flex: 1; display: flex; flex-direction: column; gap: 2px; }
        .toast-container .toast .toast-title { font-weight: 600; font-size: 14px; color: var(--text-primary); }
        .toast-container .toast .toast-message { font-size: 13px; color: var(--text-secondary); line-height: 1.4; }
        .toast-container .toast .toast-close { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 16px; padding: 4px; transition: var(--transition); flex-shrink: 0; }
        .toast-container .toast .toast-close:hover { color: var(--text-primary); transform: rotate(90deg); }
        .toast-container .toast.hiding { animation: slideOutRight 0.4s ease forwards; }
        @keyframes slideInRight { from { opacity: 0; transform: translateX(100px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes slideOutRight { from { opacity: 1; transform: translateX(0); } to { opacity: 0; transform: translateX(100px); } }
        @media (max-width: 768px) {
            .blog-hero h1 { font-size: 28px; }
            .post-card { flex-direction: column; }
            .post-card .post-image { width: 100%; min-height: 180px; max-height: 220px; }
            .post-card .post-content { padding: 20px; }
            .blog-toolbar { flex-direction: column; }
            .blog-toolbar .filter-category { width: 100%; }
        }
        @media (max-width: 480px) {
            .blog-hero { padding: 40px 0 28px; }
            .blog-hero h1 { font-size: 24px; }
        }
    </style>
</head>
<body>

<!-- ========== TOAST CONTAINER ========== -->
<div class="toast-container" id="toastContainer"></div>

<!-- ========== BLOG HEADER ========== -->
<header class="blog-header">
    <div class="container">
        <a href="/Edu-Mais/" class="nav-brand">
            <img src="assets/images/edu.png" alt="Edu Mais" class="logo" onerror="this.style.display='none'">
            <span class="brand-text">Edu <span class="highlight">Mais</span></span>
        </a>
       <div class="nav-links">
    <a href="/Edu-Mais/">Início</a>

    </div>
</header>

<!-- ========== HERO ========== -->
<section class="blog-hero">
    <div class="container">

    </div>
</section>

<!-- ========== FEED ========== -->
<section class="blog-feed">

                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Buscar artigos..." oninput="filterPosts()">
            </div>
            <select id="categoryFilter" class="filter-category" onchange="filterPosts()">
                <option value="all">Todas as categorias</option>
            </select>
            <button class="btn btn-primary btn-sm" id="newPostBtn" style="display:none;" onclick="window.location.href='/Edu-Mais/blog-admin.html'">

</button>
        </div>
        <div id="postsContainer">

                <p style="color:var(--blog-text-muted);margin-top:12px;">Carregando publicações...</p>
            </div>
        </div>
    </div>
</section>

</body>
</html>
