<!-- ========== SCRIPTS ========== -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.38.4/dist/umd/supabase.min.js"></script>
<script src="assets/js/blog.js"></script>

<script>
// ============================================
// INICIALIZAR BLOG (APENAS O MÍNIMO)
// ============================================
document.addEventListener('DOMContentLoaded', function() {
    // Botão Entrar
    document.getElementById('authBtnBlog')?.addEventListener('click', function() {
        window.location.href = '/Edu-Mais/#authModal'
    })
    
    // Botão Sair
    document.getElementById('logoutBtnBlog')?.addEventListener('click', async function() {
        await supabaseBlog.auth.signOut()
        window.location.reload()
    })
    
    // Verificar sessão e carregar posts
    checkBlogSession().then(function() {
        loadPosts()
    })
})
</script>
