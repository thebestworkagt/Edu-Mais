<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog - Edu Mais</title>
    <link rel="icon" type="image/png" href="assets/images/edu.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Merriweather:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        /* ===== ESTILOS DO BLOG (EMBUTIDOS) ===== */
        :root {
            --blog-bg: #f5f7fa;
            --blog-card: #ffffff;
            --blog-text: #1a1a2e;
            --blog-text-secondary: #4a4a6a;
            --blog-text-muted: #8a8aaa;
            --blog-border: #e8ecf1;
            --blog-shadow: 0 4px 20px rgba(0,0,0,0.06);
            --blog-shadow-hover: 0 8px 40px rgba(0,0,0,0.10);
            --blog-primary: #2563eb;
            --blog-radius: 16px;
            --blog-radius-sm: 8px;
            --blog-transition: all 0.3s ease;
        }
        [data-theme="dark"] {
            --blog-bg: #0f0f1a;
            --blog-card: #1a1a2e;
            --blog-text: #e8e8f0;
            --blog-text-secondary: #a8a8c0;
            --blog-text-muted: #6a6a8a;
            --blog-border: #2a2a44;
            --blog-shadow: 0 4px 20px rgba(0,0,0,0.3);
            --blog-shadow-hover: 0 8px 40px rgba(0,0,0,0.5);
        }
        .blog-header { background: var(--blog-card); border-bottom: 1px solid var(--blog-border); padding: 16px 0; position: sticky; top: 0; z-index: 100; backdrop-filter: blur(20px); }
        .blog-header .container { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; max-width: 1200px; margin: 0 auto; padding: 0 24px; }
        .blog-header .nav-brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }
        .blog-header .nav-brand .logo { height: 32px; }
        .blog-header .nav-brand .brand-text { font-size: 18px; font-weight: 700; color: var(--blog-text); }
        .blog-header .nav-brand .brand-text .highlight { color: var(--blog-primary); }
        .blog-header .nav-links { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
        .blog-header .nav-links a { color: var(--blog-text-secondary); text-decoration: none; font-size: 14px; font-weight: 500; transition: var(--blog-transition); }
        .blog-header .nav-links a:hover { color: var(--blog-primary); }
        .blog-header .nav-links a.active { color: var(--blog-primary); }
        .blog-hero { background: var(--blog-primary); padding: 60px 0 48px; color: #fff; text-align: center; }
        .blog-hero h1 { font-size: 42px; font-weight: 800; margin-bottom: 8px; letter-spacing: -0.5px; }
        .blog-hero p { font-size: 18px; opacity: 0.85; max-width: 600px; margin: 0 auto; }
        .blog-feed { padding: 0 0 60px; background: var(--blog-bg); min-height: 60vh; }
        .blog-feed .container { max-width: 900px; margin: 0 auto; padding: 0 24px; }
        .blog-toolbar { display: flex; gap: 16px; margin-bottom: 32px; flex-wrap: wrap; }
        .blog-toolbar .search-box { flex: 1; min-width: 200px; display: flex; align-items: center; background: var(--blog-card); border: 1px solid var(--blog-border); border-radius: var(--blog-radius-sm); padding: 0 16px; transition: var(--blog-transition); }
        .blog-toolbar .search-box:focus-within { border-color: var(--blog-primary); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15); }
        .blog-toolbar .search-box i { color: var(--blog-text-muted); font-size: 16px; }
        .blog-toolbar .search-box input { border: none; background: transparent; padding: 12px 12px; font-size: 14px; color: var(--blog-text); width: 100%; outline: none; font-family: 'Inter', sans-serif; }
        .blog-toolbar .search-box input::placeholder { color: var(--blog-text-muted); }
        .blog-toolbar .filter-category { padding: 10px 16px; border: 1px solid var(--blog-border); border-radius: var(--blog-radius-sm); background: var(--blog-card); color: var(--blog-text); font-size: 14px; cursor: pointer; font-family: 'Inter', sans-serif; min-width: 140px; }
        .blog-toolbar .filter-category:focus { outline: none; border-color: var(--blog-primary); }
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 24px; border: none; border-radius: 8px; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 14px; cursor: pointer; transition: all 0.3s ease; text-decoration: none; }
        .btn-primary { background: linear-gradient(135deg, #217346 0%, #2E8B57 50%, #3BA370 100%); color: #fff; box-shadow: 0 4px 20px rgba(33,115,70,0.3); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(33,115,70,0.5); }
        .btn-outline { background: transparent; color: var(--text-primary); border: 2px solid var(--border-color); }
        .btn-outline:hover { border-color: var(--primary); color: var(--primary-light); }
        .btn-outline-danger { background: transparent; color: #ff6b6b; border: 2px solid #ff6b6b; }
        .btn-outline-danger:hover { background: #ff6b6b; color: #fff; }
        .btn-sm { padding: 6px 16px; font-size: 13px; }
        .posts-grid { display: grid; gap: 24px; }
        .post-card { background: var(--blog-card); border-radius: var(--blog-radius); overflow: hidden; border: 1px solid var(--blog-border); transition: var(--blog-transition); cursor: pointer; display: flex; gap: 0; }
        .post-card:hover { transform: translateY(-4px); box-shadow: var(--blog-shadow-hover); border-color: var(--blog-primary); }
        .post-card .post-image { width: 280px; min-height: 200px; flex-shrink: 0; background: var(--blog-border); display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .post-card .post-image img { width: 100%; height: 100%; object-fit: cover; }
        .post-card .post-image .no-image { font-size: 48px; color: var(--blog-text-muted); opacity: 0.3; }
        .post-card .post-content { padding: 24px 28px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .post-card .post-meta { display: flex; gap: 16px; align-items: center; font-size: 13px; color: var(--blog-text-muted); margin-bottom: 8px; flex-wrap: wrap; }
        .post-card .post-meta .category { background: rgba(37, 99, 235, 0.12); color: var(--blog-primary); padding: 2px 12px; border-radius: 50px; font-weight: 600; font-size: 12px; }
        .post-card .post-meta .date { display: flex; align-items: center; gap: 4px; }
        .post-card .post-title { font-size: 20px; font-weight: 700; color: var(--blog-text); margin-bottom: 8px; line-height: 1.3; }
        .post-card .post-title a { color: inherit; text-decoration: none; }
        .post-card .post-title a:hover { color: var(--blog-primary); }
        .post-card .post-excerpt { color: var(--blog-text-secondary); font-size: 15px; line-height: 1.6; margin-bottom: 12px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        .post-card .post-footer { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--blog-text-muted); padding-top: 12px; border-top: 1px solid var(--blog-border); }
        .post-card .post-footer .author { display: flex; align-items: center; gap: 8px; }
        .post-card .post-footer .author .avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--blog-primary); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; }
        .blog-loading { text-align: center; padding: 60px 20px; }
        .blog-loading i { font-size: 40px; color: var(--blog-primary); animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .blog-empty { text-align: center; padding: 80px 20px; color: var(--blog-text-muted); }
        .blog-empty i { font-size: 64px; opacity: 0.3; margin-bottom: 16px; }
        .blog-empty h3 { font-size: 24px; color: var(--blog-text); margin-bottom: 8px; }
        .toast-container { position: fixed; top: 90px; right: 24px; z-index: 9999; display: flex; flex-direction: column; gap: 12px; max-width: 420px; width: 100%; pointer-events: none; }
        .toast-container .toast { pointer-events: all; padding: 16px 20px; border-radius: 8px; background: var(--bg-card); border: 1px solid var(--border-color); box-shadow: var(--shadow); display: flex; align-items: flex-start; gap: 14px; animation: slideInRight 0.4s ease forwards; backdrop-filter: blur(10px); position: relative; overflow: hidden; }
        .toast-container .toast::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; }
        .toast-container .toast.success::before { background: #2E8B57; }
        .toast-container .toast.error::before { background: #e74c3c; }
        .toast-container .toast.warning::before { background: #f39c12; }
        .toast-container .toast.info::before { background: #3498db; }
        .toast-container .toast .toast-icon { font-size: 20px; flex-shrink: 0; margin-top: 2px; }
        .toast-container .toast.success .toast-icon { color: #2E8B57; }
        .toast-container .toast.error .toast-icon { color: #e74c3c; }
        .toast-container .toast.warning .toast-icon { color: #f39c12; }
        .toast-container .toast.info .toast-icon { color: #3498db; }
        .toast-container .toast .toast-content { flex: 1; display: flex; flex-direction: column; gap: 2px; }
        .toast-container .toast .toast-title { font-weight: 600; font-size: 14px; color: var(--text-primary); }
        .toast-container .toast .toast-message { font-size: 13px; color: var(--text-secondary); line-height: 1.4; }
        .toast-container .toast .toast-close { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 16px; padding: 4px; transition: var(--transition); flex-shrink: 0; }
        .toast-container .toast .toast-close:hover { color: var(--text-primary); transform: rotate(90deg); }
        .toast-container .toast.hiding { animation: slideOutRight 0.4s ease forwards; }
        @keyframes slideInRight { from { opacity: 0; transform: translateX(100px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes slideOutRight { from { opacity: 1; transform: translateX(0); } to { opacity: 0; transform: translateX(100px); } }
        @media (max-width: 768px) {
            .blog-hero h1 { font-size: 28px; }
            .post-card { flex-direction: column; }
            .post-card .post-image { width: 100%; min-height: 180px; max-height: 220px; }
            .post-card .post-content { padding: 20px; }
            .blog-toolbar { flex-direction: column; }
            .blog-toolbar .filter-category { width: 100%; }
        }
        @media (max-width: 480px) {
            .blog-hero { padding: 40px 0 28px; }
            .blog-hero h1 { font-size: 24px; }
        }
    </style>
</head>
<body>

<!-- ========== TOAST CONTAINER ========== -->
<div class="toast-container" id="toastContainer"></div>

<!-- ========== BLOG HEADER ========== -->
<header class="blog-header">
    <div class="container">
        <a href="/Edu-Mais/" class="nav-brand">
            <img src="assets/images/edu.png" alt="Edu Mais" class="logo" onerror="this.style.display='none'">
            <span class="brand-text">Edu <span class="highlight">Mais</span></span>
        </a>
        <div class="nav-links">
            <a href="/Edu-Mais/">Início</a>
            <a href="/Edu-Mais/blog.html" class="active">Blog</a>
            <a href="/Edu-Mais/#niveis">Níveis</a>
            <a href="/Edu-Mais/#contato">Contato</a>
            <button class="btn btn-primary btn-sm" id="authBtnBlog">Entrar</button>
            <button class="btn btn-outline-danger btn-sm" id="logoutBtnBlog" style="display:none;">Sair</button>
        </div>
    </div>
</header>

<!-- ========== HERO ========== -->
<section class="blog-hero">
    <div class="container">
        <h1>📝 Blog</h1>
        <p>Artigos, dicas e tutoriais sobre Excel e produtividade</p>
    </div>
</section>

<!-- ========== FEED ========== -->
<section class="blog-feed">
    <div class="container">
        <div class="blog-toolbar">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Buscar artigos..." oninput="filterPosts()">
            </div>
            <select id="categoryFilter" class="filter-category" onchange="filterPosts()">
                <option value="all">Todas as categorias</option>
            </select>
            <button class="btn btn-primary btn-sm" id="newPostBtn" style="display:none;" onclick="window.location.href='/Edu-Mais/blog-admin.html'">
                <i class="fas fa-plus"></i> Novo Post
            </button>
        </div>
        <div id="postsContainer">
            <div class="blog-loading">
                <i class="fas fa-spinner fa-spin"></i>
                <p style="color:var(--blog-text-muted);margin-top:12px;">Carregando publicações...</p>
            </div>
        </div>
    </div>
</section>

<!-- ========== SCRIPTS ========== -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.38.4/dist/umd/supabase.min.js"></script>
<script>
// ============================================
// CONFIGURAÇÃO SUPABASE (BLOG)
// ============================================
const SUPABASE_URL = 'https://gslhfgaoqkcrhyfnmmxt.supabase.co'
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdzbGhmZ2FvcWtjcmh5Zm5tbXh0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3MDY1OTEsImV4cCI6MjEwMjI4MjU5MX0.tuUvoVuFni1eh0M_j-iG_qI-vwa3116a7mgyCqhVejk'

const supabaseBlog = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
console.log('📝 Blog inicializado')

// ============================================
// ESTADO
// ============================================
let allPosts = []
let currentCategory = 'all'
let searchTerm = ''
let currentUserBlog = null
let isAdminBlog = false

// ============================================
// TOAST
// ============================================
const ToastBlog = {
    container: document.getElementById('toastContainer'),
    show: function(title, message, type, duration) {
        const icons = { success: 'fa-check-circle', error: 'fa-exclamation-circle', warning: 'fa-exclamation-triangle', info: 'fa-info-circle' }
        const toast = document.createElement('div')
        toast.className = 'toast ' + (type || 'info')
        toast.innerHTML = `
            <i class="fas ${icons[type] || icons.info} toast-icon"></i>
            <div class="toast-content">
                <div class="toast-title">${title}</div>
                <div class="toast-message">${message}</div>
            </div>
            <button class="toast-close"><i class="fas fa-times"></i></button>
        `
        toast.querySelector('.toast-close').onclick = function() {
            toast.classList.add('hiding')
            setTimeout(function() { if (toast.parentNode) toast.parentNode.removeChild(toast) }, 400)
        }
        setTimeout(function() {
            toast.classList.add('hiding')
            setTimeout(function() { if (toast.parentNode) toast.parentNode.removeChild(toast) }, 400)
        }, duration || 4000)
        ToastBlog.container.appendChild(toast)
        return toast
    },
    success: function(title, msg, d) { return this.show(title, msg, 'success', d || 4000) },
    error: function(title, msg, d) { return this.show(title, msg, 'error', d || 5000) },
    warning: function(title, msg, d) { return this.show(title, msg, 'warning', d || 4000) },
    info: function(title, msg, d) { return this.show(title, msg, 'info', d || 3000) }
}

// ============================================
// VERIFICAR SESSÃO
// ============================================
async function checkBlogSession() {
    try {
        const { data: { session } } = await supabaseBlog.auth.getSession()
        if (session) {
            currentUserBlog = session.user
            const { data } = await supabaseBlog.from('admins').select('id').eq('id', currentUserBlog.id).maybeSingle()
            isAdminBlog = !!data
            console.log('✅ Usuário logado:', currentUserBlog.email, 'Admin:', isAdminBlog)
        } else {
            currentUserBlog = null
            isAdminBlog = false
            console.log('👤 Nenhum usuário logado')
        }
        updateBlogButtons()
    } catch (error) {
        console.error('Erro ao verificar sessão:', error)
    }
}

function updateBlogButtons() {
    const authBtn = document.getElementById('authBtnBlog')
    const logoutBtn = document.getElementById('logoutBtnBlog')
    const newPostBtn = document.getElementById('newPostBtn')
    
    if (currentUserBlog) {
        if (authBtn) authBtn.style.display = 'none'
        if (logoutBtn) logoutBtn.style.display = 'inline-flex'
    } else {
        if (authBtn) authBtn.style.display = 'inline-flex'
        if (logoutBtn) logoutBtn.style.display = 'none'
    }
    
    if (newPostBtn) {
        newPostBtn.style.display = isAdminBlog ? 'inline-flex' : 'none'
    }
}

// ============================================
// CARREGAR POSTS
// ============================================
async function loadPosts() {
    const container = document.getElementById('postsContainer')
    if (!container) return
    
    container.innerHTML = '<div class="blog-loading"><i class="fas fa-spinner fa-spin"></i><p style="color:var(--blog-text-muted);margin-top:12px;">Carregando publicações...</p></div>'
    
    try {
        console.log('📝 Carregando posts...')
        let query = supabaseBlog
            .from('posts')
            .select('*')
            .order('published_at', { ascending: false })
        
        if (!isAdminBlog) {
            query = query.eq('is_published', true)
        }
        
        const { data, error } = await query
        
        if (error) {
            console.error('❌ Erro:', error)
            throw error
        }
        
        allPosts = data || []
        console.log('✅ Posts carregados:', allPosts.length)
        renderPosts(allPosts)
        loadCategories(allPosts)
        
    } catch (error) {
        console.error('❌ Erro:', error)
        container.innerHTML = `
            <div class="blog-empty">
                <i class="fas fa-exclamation-triangle"></i>
                <h3>Erro ao carregar</h3>
                <p>Não foi possível carregar as publicações.</p>
                <button onclick="loadPosts()" class="btn btn-primary btn-sm" style="margin-top:12px;">
                    <i class="fas fa-sync"></i> Recarregar
                </button>
            </div>
        `
    }
}

// ============================================
// RENDERIZAR POSTS
// ============================================
function renderPosts(posts) {
    const container = document.getElementById('postsContainer')
    if (!container) return
    
    let filtered = posts.slice()
    
    if (currentCategory !== 'all') {
        filtered = filtered.filter(function(p) { return p.category === currentCategory })
    }
    
    if (searchTerm.trim()) {
        const term = searchTerm.toLowerCase().trim()
        filtered = filtered.filter(function(p) {
            return p.title.toLowerCase().includes(term) || 
                   p.content.toLowerCase().includes(term) || 
                   (p.excerpt && p.excerpt.toLowerCase().includes(term))
        })
    }
    
    if (filtered.length === 0) {
        container.innerHTML = `
            <div class="blog-empty">
                <i class="fas fa-search"></i>
                <h3>Nenhum resultado</h3>
                <p>Tente ajustar seus filtros.</p>
                <button onclick="resetFilters()" class="btn btn-outline btn-sm" style="margin-top:12px;">
                    <i class="fas fa-undo"></i> Limpar filtros
                </button>
            </div>
        `
        return
    }
    
    let html = '<div class="posts-grid">'
    filtered.forEach(function(post) {
        const imageHtml = post.featured_image ? 
            '<img src="' + post.featured_image + '" alt="' + post.title + '" loading="lazy">' : 
            '<span class="no-image"><i class="fas fa-file-alt"></i></span>'
        
        html += `
            <div class="post-card" onclick="window.location.href='/Edu-Mais/post.html?slug=${post.slug}'">
                <div class="post-image">${imageHtml}</div>
                <div class="post-content">
                    <div>
                        <div class="post-meta">
                            <span class="category">${post.category || 'Geral'}</span>
                            <span class="date"><i class="far fa-calendar-alt"></i> ${formatDateBlog(post.published_at)}</span>
                            ${!post.is_published && isAdminBlog ? '<span style="color:#f39c12;">📝 Rascunho</span>' : ''}
                        </div>
                        <h3 class="post-title"><a href="/Edu-Mais/post.html?slug=${post.slug}">${post.title}</a></h3>
                        <p class="post-excerpt">${post.excerpt || post.content.substring(0, 160) + '...'}</p>
                    </div>
                    <div class="post-footer">
                        <span class="author">
                            <span class="avatar">${post.author_name ? post.author_name.charAt(0).toUpperCase() : 'A'}</span>
                            ${post.author_name || 'Admin'}
                        </span>
                        <span><i class="far fa-eye"></i> ${post.views || 0}</span>
                    </div>
                </div>
            </div>
        `
    })
    html += '</div>'
    container.innerHTML = html
}

// ============================================
// CARREGAR CATEGORIAS
// ============================================
function loadCategories(posts) {
    const filter = document.getElementById('categoryFilter')
    if (!filter) return
    
    const categories = ['all']
    posts.forEach(function(p) {
        if (p.category && categories.indexOf(p.category) === -1) {
            categories.push(p.category)
        }
    })
    
    let html = ''
    categories.forEach(function(cat) {
        const label = cat === 'all' ? 'Todas as categorias' : cat
        const selected = cat === currentCategory ? 'selected' : ''
        html += '<option value="' + cat + '" ' + selected + '>' + label + '</option>'
    })
    filter.innerHTML = html
}

// ============================================
// FILTRAR
// ============================================
function filterPosts() {
    const filter = document.getElementById('categoryFilter')
    const search = document.getElementById('searchInput')
    currentCategory = filter ? filter.value : 'all'
    searchTerm = search ? search.value : ''
    renderPosts(allPosts)
}

function resetFilters() {
    const filter = document.getElementById('categoryFilter')
    const search = document.getElementById('searchInput')
    if (filter) filter.value = 'all'
    if (search) search.value = ''
    currentCategory = 'all'
    searchTerm = ''
    renderPosts(allPosts)
}

// ============================================
// FORMATAR DATA
// ============================================
function formatDateBlog(dateString) {
    if (!dateString) return 'Data não disponível'
    try {
        const d = new Date(dateString)
        return d.toLocaleDateString('pt-PT', { day: '2-digit', month: 'long', year: 'numeric' })
    } catch {
        return 'Data inválida'
    }
}

// ============================================
// CARREGAR POST INDIVIDUAL
// ============================================
async function loadPost() {
    const container = document.getElementById('postContent')
    if (!container) return
    
    const params = new URLSearchParams(window.location.search)
    const slug = params.get('slug')
    
    if (!slug) {
        container.innerHTML = `
            <div class="blog-empty">
                <i class="fas fa-exclamation-circle"></i>
                <h3>Publicação não encontrada</h3>
                <p>O artigo que você procura não existe.</p>
                <a href="/Edu-Mais/blog.html" class="btn btn-primary btn-sm" style="margin-top:12px;">
                    <i class="fas fa-arrow-left"></i> Voltar ao blog
                </a>
            </div>
        `
        return
    }
    
    container.innerHTML = '<div class="blog-loading"><i class="fas fa-spinner fa-spin"></i><p style="color:var(--blog-text-muted);margin-top:12px;">Carregando artigo...</p></div>'
    
    try {
        console.log('📝 Carregando post:', slug)
        const { data: post, error } = await supabaseBlog.from('posts').select('*').eq('slug', slug).single()
        
        if (error) {
            console.error('❌ Erro:', error)
            throw error
        }
        
        if (!post) {
            throw new Error('Post não encontrado')
        }
        
        if (!post.is_published && !isAdminBlog) {
            container.innerHTML = `
                <div class="blog-empty">
                    <i class="fas fa-lock"></i>
                    <h3>Publicação não disponível</h3>
                    <p>Este artigo não está publicado.</p>
                    <a href="/Edu-Mais/blog.html" class="btn btn-primary btn-sm" style="margin-top:12px;">
                        <i class="fas fa-arrow-left"></i> Voltar ao blog
                    </a>
                </div>
            `
            return
        }
        
        // Incrementar visualizações
        try {
            const newViews = (post.views || 0) + 1
            await supabaseBlog
                .from('posts')
                .update({ views: newViews })
                .eq('id', post.id)
            post.views = newViews
            console.log('✅ Views atualizadas:', newViews)
        } catch (viewError) {
            console.warn('⚠️ Erro ao atualizar views:', viewError)
        }
        
        renderPost(post)
        
    } catch (error) {
        console.error('❌ Erro:', error)
        container.innerHTML = `
            <div class="blog-empty">
                <i class="fas fa-exclamation-triangle"></i>
                <h3>Erro ao carregar</h3>
                <p>Não foi possível carregar este artigo.</p>
                <a href="/Edu-Mais/blog.html" class="btn btn-primary btn-sm" style="margin-top:12px;">
                    <i class="fas fa-arrow-left"></i> Voltar ao blog
                </a>
            </div>
        `
    }
}

// ============================================
// RENDERIZAR POST INDIVIDUAL
// ============================================
function renderPost(post) {
    const container = document.getElementById('postContent')
    if (!container) return
    
    const imageHtml = post.featured_image ? 
        '<img src="' + post.featured_image + '" alt="' + post.title + '" class="article-featured-image">' : 
        ''
    
    const adminHtml = isAdminBlog ? `
        <div class="admin-actions">
            <a href="/Edu-Mais/blog-admin.html?edit=${post.id}" class="btn btn-primary btn-sm">
                <i class="fas fa-edit"></i> Editar
            </a>
            <button class="btn btn-danger btn-sm" onclick="deletePost(${post.id})">
                <i class="fas fa-trash"></i> Excluir
            </button>
        </div>
    ` : ''
    
    container.innerHTML = `
        <article class="post-article">
            <div class="article-header">
                <a href="/Edu-Mais/blog.html" class="back-link">
                    <i class="fas fa-arrow-left"></i> Voltar para o blog
                </a>
                <h1>${post.title}</h1>
                <div class="article-meta">
                    <span><i class="far fa-calendar-alt"></i> ${formatDateBlog(post.published_at)}</span>
                    <span><i class="far fa-user"></i> ${post.author_name || 'Admin'}</span>
                    <span><i class="far fa-folder"></i> ${post.category || 'Geral'}</span>
                    <span><i class="far fa-eye"></i> ${post.views || 0} visualizações</span>
                    ${!post.is_published && isAdminBlog ? '<span style="color:#f39c12;">📝 Rascunho</span>' : ''}
                </div>
            </div>
            ${imageHtml}
            <div class="article-content">${post.content}</div>
            ${adminHtml}
        </article>
    `
}

// ============================================
// ADMIN - SALVAR POST
// ============================================
async function savePost(event) {
    event.preventDefault()
    
    const id = document.getElementById('postId') ? document.getElementById('postId').value : null
    const title = document.getElementById('postTitle').value.trim()
    const content = document.getElementById('postContent').value.trim()
    const excerpt = document.getElementById('postExcerpt').value.trim()
    const category = document.getElementById('postCategory').value.trim() || 'Geral'
    const featured_image = document.getElementById('postImage').value.trim()
    const is_published = document.getElementById('postPublished').value === 'true'
    
    if (!title || !content) {
        ToastBlog.warning('Campos obrigatórios', 'Preencha o título e o conteúdo.')
        return
    }
    
    const slug = title
        .toLowerCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/^-+|-+$/g, '')
    
    try {
        const { data: { session } } = await supabaseBlog.auth.getSession()
        if (!session) {
            ToastBlog.error('Acesso negado', 'Você precisa estar logado.')
            return
        }
        
        const { data: adminCheck } = await supabaseBlog
            .from('admins')
            .select('id')
            .eq('id', session.user.id)
            .maybeSingle()
        
        if (!adminCheck) {
            ToastBlog.error('Acesso negado', 'Apenas administradores podem publicar.')
            return
        }
        
        const postData = {
            title: title,
            slug: slug,
            content: content,
            excerpt: excerpt || content.substring(0, 160),
            category: category,
            featured_image: featured_image,
            is_published: is_published,
            author_id: session.user.id,
            author_name: session.user.user_metadata ? session.user.user_metadata.full_name || 'Admin' : 'Admin',
            updated_at: new Date().toISOString()
        }
        
        let result
        if (id) {
            result = await supabaseBlog.from('posts').update(postData).eq('id', id)
        } else {
            postData.published_at = new Date().toISOString()
            result = await supabaseBlog.from('posts').insert(postData)
        }
        
        if (result.error) throw result.error
        
        ToastBlog.success(id ? 'Publicação atualizada!' : 'Publicação criada!', 'O artigo foi salvo com sucesso.')
        setTimeout(function() {
            window.location.href = '/Edu-Mais/post.html?slug=' + slug
        }, 1000)
        
    } catch (error) {
        console.error('Erro ao salvar:', error)
        ToastBlog.error('Erro', 'Não foi possível salvar a publicação.')
    }
}

// ============================================
// ADMIN - EXCLUIR POST
// ============================================
async function deletePost(postId) {
    if (!confirm('Tem certeza que deseja excluir esta publicação?')) return
    try {
        await supabaseBlog.from('posts').delete().eq('id', postId)
        ToastBlog.success('Publicação excluída!', 'O artigo foi removido.')
        window.location.href = '/Edu-Mais/blog.html'
    } catch (error) {
        ToastBlog.error('Erro', 'Não foi possível excluir.')
    }
}

// ============================================
// CARREGAR POST PARA EDIÇÃO
// ============================================
async function loadPostForEdit() {
    const params = new URLSearchParams(window.location.search)
    const editId = params.get('edit')
    if (!editId) return
    
    try {
        const { data: post, error } = await supabaseBlog.from('posts').select('*').eq('id', editId).single()
        if (error) throw error
        
        document.getElementById('postId').value = post.id
        document.getElementById('postTitle').value = post.title
        document.getElementById('postContent').value = post.content
        document.getElementById('postExcerpt').value = post.excerpt || ''
        document.getElementById('postCategory').value = post.category || 'Geral'
        document.getElementById('postImage').value = post.featured_image || ''
        document.getElementById('postPublished').value = post.is_published ? 'true' : 'false'
        document.getElementById('formTitle').textContent = '✏️ Editar Publicação'
        document.getElementById('submitBtn').textContent = 'Atualizar Publicação'
        
        console.log('✅ Post carregado para edição')
        
    } catch (error) {
        console.error('Erro ao carregar post:', error)
        ToastBlog.error('Erro', 'Não foi possível carregar a publicação.')
    }
}

            console.log('🖱️ Sair...')
            await supabaseBlog.auth.signOut()

        })
    }
    
    // ⭐ Verificar sessão e carregar posts
    checkBlogSession().then(function() {
        loadPosts()
    })
})
