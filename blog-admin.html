<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrar Blog - Edu Mais</title>
    <link rel="icon" type="image/png" href="assets/images/edu.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Merriweather:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .admin-form { max-width: 800px; margin: 0 auto; padding: 40px 24px 60px; background: var(--blog-bg); min-height: 60vh; }
        .admin-form .form-card { background: var(--blog-card); border-radius: var(--blog-radius); padding: 32px; border: 1px solid var(--blog-border); box-shadow: var(--blog-shadow); }
        .admin-form .form-card h2 { font-size: 28px; margin-bottom: 8px; color: var(--blog-text); }
        .admin-form .form-card .subtitle { color: var(--blog-text-muted); margin-bottom: 24px; }
        .admin-form .form-group { margin-bottom: 20px; }
        .admin-form .form-group label { display: block; font-weight: 600; font-size: 14px; color: var(--blog-text-secondary); margin-bottom: 4px; }
        .admin-form .form-group input, .admin-form .form-group textarea, .admin-form .form-group select {
            width: 100%; padding: 10px 14px; border-radius: var(--blog-radius-sm); border: 1px solid var(--blog-border);
            background: var(--blog-bg); color: var(--blog-text); font-size: 14px; transition: var(--blog-transition); font-family: 'Inter', sans-serif;
        }
        .admin-form .form-group input:focus, .admin-form .form-group textarea:focus, .admin-form .form-group select:focus {
            outline: none; border-color: var(--blog-primary); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }
        .admin-form .form-group textarea { min-height: 200px; resize: vertical; font-family: 'Merriweather', serif; font-size: 15px; line-height: 1.8; }
        .admin-form .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .admin-form .form-actions { display: flex; gap: 12px; margin-top: 24px; flex-wrap: wrap; }
        .admin-form .form-actions .btn { padding: 12px 32px; }
        .toast-container { position: fixed; top: 90px; right: 24px; z-index: 9999; display: flex; flex-direction: column; gap: 12px; max-width: 420px; width: 100%; pointer-events: none; }
        .toast-container .toast { pointer-events: all; padding: 16px 20px; border-radius: 8px; background: var(--bg-card); border: 1px solid var(--border-color); box-shadow: var(--shadow); display: flex; align-items: flex-start; gap: 14px; animation: slideInRight 0.4s ease forwards; backdrop-filter: blur(10px); position: relative; overflow: hidden; }
        .toast-container .toast::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; }
        .toast-container .toast.success::before { background: #2E8B57; }
        .toast-container .toast.error::before { background: #e74c3c; }
        .toast-container .toast.warning::before { background: #f39c12; }
        .toast-container .toast.info::before { background: #3498db; }
        .toast-container .toast .toast-icon { font-size: 20px; flex-shrink: 0; margin-top: 2px; }
        .toast-container .toast.success .toast-icon { color: #2E8B57; }
        .toast-container .toast.error .toast-icon { color: #e74c3c; }
        .toast-container .toast.warning .toast-icon { color: #f39c12; }
        .toast-container .toast.info .toast-icon { color: #3498db; }
        .toast-container .toast .toast-content { flex: 1; display: flex; flex-direction: column; gap: 2px; }
        .toast-container .toast .toast-title { font-weight: 600; font-size: 14px; color: var(--text-primary); }
        .toast-container .toast .toast-message { font-size: 13px; color: var(--text-secondary); line-height: 1.4; }
        .toast-container .toast .toast-close { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 16px; padding: 4px; transition: var(--transition); flex-shrink: 0; }
        .toast-container .toast .toast-close:hover { color: var(--text-primary); transform: rotate(90deg); }
        .toast-container .toast.hiding { animation: slideOutRight 0.4s ease forwards; }
        @keyframes slideInRight { from { opacity: 0; transform: translateX(100px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes slideOutRight { from { opacity: 1; transform: translateX(0); } to { opacity: 0; transform: translateX(100px); } }
        .blog-header { background: var(--blog-card); border-bottom: 1px solid var(--blog-border); padding: 16px 0; position: sticky; top: 0; z-index: 100; backdrop-filter: blur(20px); }
        .blog-header .container { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; max-width: 1200px; margin: 0 auto; padding: 0 24px; }
        .blog-header .nav-brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }
        .blog-header .nav-brand .logo { height: 32px; }
        .blog-header .nav-brand .brand-text { font-size: 18px; font-weight: 700; color: var(--blog-text); }
        .blog-header .nav-brand .brand-text .highlight { color: var(--blog-primary); }
        .blog-header .nav-links { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
        .blog-header .nav-links a { color: var(--blog-text-secondary); text-decoration: none; font-size: 14px; font-weight: 500; transition: var(--blog-transition); }
        .blog-header .nav-links a:hover { color: var(--blog-primary); }
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 24px; border: none; border-radius: 8px; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 14px; cursor: pointer; transition: all 0.3s ease; text-decoration: none; }
        .btn-primary { background: linear-gradient(135deg, #217346 0%, #2E8B57 50%, #3BA370 100%); color: #fff; box-shadow: 0 4px 20px rgba(33,115,70,0.3); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(33,115,70,0.5); }
        .btn-outline { background: transparent; color: var(--text-primary); border: 2px solid var(--border-color); }
        .btn-outline:hover { border-color: var(--primary); color: var(--primary-light); }
        .btn-outline-danger { background: transparent; color: #ff6b6b; border: 2px solid #ff6b6b; }
        .btn-outline-danger:hover { background: #ff6b6b; color: #fff; }
        .btn-sm { padding: 6px 16px; font-size: 13px; }
        @media (max-width: 600px) { .admin-form .form-row { grid-template-columns: 1fr; } .admin-form .form-card { padding: 20px; } }
    </style>
</head>
<body>

<!-- ========== TOAST CONTAINER ========== -->
<div class="toast-container" id="toastContainer"></div>

<!-- ========== BLOG HEADER ========== -->
<header class="blog-header">
    <div class="container">
        <a href="/Edu-Mais/" class="nav-brand">
            <img src="assets/images/edu.png" alt="Edu Mais" class="logo" onerror="this.style.display='none'">
            <span class="brand-text">Edu <span class="highlight">Mais</span></span>
        </a>
        <div class="nav-links">
            <a href="/Edu-Mais/">Início</a>
            <a href="/Edu-Mais/blog.html">Blog</a>
            <a href="/Edu-Mais/#niveis">Níveis</a>
            <a href="/Edu-Mais/#contato">Contato</a>
            <button class="btn btn-outline-danger btn-sm" id="logoutBtnAdmin">Sair</button>
        </div>
    </div>
</header>

<!-- ========== FORM ========== -->
<section class="admin-form">
    <div class="form-card">
        <h2 id="formTitle">✍️ Nova Publicação</h2>
        <p class="subtitle">Crie um artigo para o blog. URLs amigáveis são geradas automaticamente.</p>
        
        <form id="postForm" onsubmit="savePost(event)">
            <input type="hidden" id="postId">
            
            <div class="form-group">
                <label>Título *</label>
                <input type="text" id="postTitle" placeholder="Ex: Como dominar o Excel em 30 dias" required>
            </div>
            
            <div class="form-group">
                <label>Conteúdo * (HTML suportado)</label>
                <textarea id="postContent" placeholder="Escreva seu artigo aqui..." required></textarea>
            </div>
            
            <div class="form-group">
                <label>Resumo (opcional)</label>
                <input type="text" id="postExcerpt" placeholder="Breve resumo do artigo (máx 160 caracteres)">
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label>Categoria</label>
                    <input type="text" id="postCategory" placeholder="Ex: Dicas, Tutoriais" value="Geral">
                </div>
                <div class="form-group">
                    <label>URL da imagem de destaque</label>
                    <input type="url" id="postImage" placeholder="https://exemplo.com/imagem.jpg">
                </div>
            </div>
            
            <div class="form-group">
                <label>Status</label>
                <select id="postPublished">
                    <option value="true">📢 Publicar</option>
                    <option value="false">📝 Salvar como rascunho</option>
                </select>
            </div>
            
            <div class="form-actions">
                <button type="submit" class="btn btn-primary" id="submitBtn">Publicar Artigo</button>
                <a href="/Edu-Mais/blog.html" class="btn btn-outline">Cancelar</a>
            </div>
        </form>
    </div>
</section>

<!-- ========== SCRIPTS ========== -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.38.4/dist/umd/supabase.min.js"></script>
<script src="assets/js/blog.js"></script>

<script>
// ============================================
// INICIALIZAR ADMIN DO BLOG
// ============================================
document.addEventListener('DOMContentLoaded', async function() {
    console.log('📝 Inicializando admin do blog...')
    
    // ⭐ Verificar se é admin DIRETO no Supabase
    const supabaseBlog = window.supabaseBlog || window.supabase.createClient(
        'https://gslhfgaoqkcrhyfnmmxt.supabase.co',
        'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdzbGhmZ2FvcWtjcmh5Zm5tbXh0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3MDY1OTEsImV4cCI6MjEwMjI4MjU5MX0.tuUvoVuFni1eh0M_j-iG_qI-vwa3116a7mgyCqhVejk'
    )
    
    const { data: { session } } = await supabaseBlog.auth.getSession()
    
    if (!session) {
        ToastBlog.error('Acesso negado', 'Você precisa estar logado.')
        setTimeout(() => { window.location.href = '/Edu-Mais/' }, 2000)
        return
    }
    
    const { data: adminCheck } = await supabaseBlog
        .from('admins')
        .select('id')
        .eq('id', session.user.id)
        .maybeSingle()
    
    if (!adminCheck) {
        ToastBlog.error('Acesso negado', 'Apenas administradores podem acessar esta área.')
        setTimeout(() => { window.location.href = '/Edu-Mais/blog.html' }, 2000)
        return
    }
    
    console.log('✅ Admin verificado:', session.user.email)
    
    // ⭐ Botão Sair
    const logoutBtn = document.getElementById('logoutBtnAdmin')
    if (logoutBtn) {
        logoutBtn.addEventListener('click', async function() {
            await supabaseBlog.auth.signOut()
            window.location.href = '/Edu-Mais/'
        })
    }
    
    // ⭐ Carregar post para edição
    await loadPostForEdit()
})
</script>
</body>
</html>
